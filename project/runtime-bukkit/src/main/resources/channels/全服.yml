Options:
  Speak-Condition: 'perm "trchat.global"'
  Proxy: true
  Force-Proxy: false
  Double-Transfer: true
  Always-Listen: true
  # 全服频道每天允许发送的次数；按 Asia/Shanghai 自然日重置
  Daily-Limit:
    # 没有匹配到下列主组时的每日次数；-1 表示不限量
    Default: 10
    # 每日次数重置所用的时区
    Timezone: 'Asia/Shanghai'
    # LuckPerms 主组名称对应的每日次数
    Groups:
      # 普通玩家每日 10 次
      default: 10
      # VIP1 每日 20 次
      vip1: 20
      # VIP2 每日 30 次
      vip2: 30
      # VIP3 每日 40 次
      vip3: 40
      # 管理人员不限制次数
      moderator: -1
      # 管理员不限制次数
      admin: -1

Bindings:
  Prefix: ['!all']
  Command: ['global', 'all', 'shout']

Formats:
  - condition: null
    prefix:
      channel:
        text: '&8[&c全服&8] '
      server:
        text: '&8[&3%server_name%&8] '
        hover: |-
          &7服务器 &3%server_name%
          &f
          &7版本：&6%server_version%
          &7在线：&a%server_online%&7/&2%server_max_players%
          &7TPS：&b%server_tps%
      player-title:
        text: ' %luckperms_prefix% %playerTitle_use% '
      player:
        text: '&e%player_name%&8: '
    msg:
      default-color: 'f'
      special-char:
        enabled: false
        special-char-color: '&f'
      hover: '&7Date: %server_time_HH:mm:ss%'

# Can't use placeholders!
Console:
  - prefix:
      server:
        text: '&e控制台&8: '
    msg:
      default-color: 'f'
      special-char:
        enabled: false
        special-char-color: '&f'
