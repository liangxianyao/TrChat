Options:
  Join-Permission: 'trchat.admin'
  Proxy: true
  Always-Listen: true

Bindings:
  Command: ['staff']

Formats:
  - prefix:
      staff:
        text: '&8[&c管理&8] '
        hover: |-
          &7服务器 &3%server_name%
          &f
          &7版本：&6%server_version%
          &7在线：&a%server_online%&7/&2%server_max_players%
          &7TPS：&b%server_tps%
          &7
          &a▶ &2点击连接到此服务器
        command: '/server %server_name%'
      player-title:
        text: ' %luckperms_prefix% %playerTitle_use% '
      player:
        text: '&e%player_name%&8: '
    msg:
      default-color: 'a'
      special-char:
        enabled: false
        special-char-color: '&f'
      hover: '&7Date: %server_time_HH:mm:ss%'
