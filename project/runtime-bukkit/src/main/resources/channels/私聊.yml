Options:
  Join-Permission: 'trchat.private'
  Proxy: true
  Disabled-Functions: ['Mention']
  Private: true

Bindings:
  Command: ['msg', 'message', 'tell', 'talk', 'm', 'whisper', 'w']

Sender:
  - prefix:
      sender:
        text: '&8[&d私聊&8] [&a%player_name% &7➦ %trchat_toplayer%&8] '
    msg:
      default-color: 'f'
      special-char:
        enabled: false
        special-char-color: '&f'
      hover: '&7日期: %server_time_HH:mm:ss%'

Receiver:
  - prefix:
      receiver:
        text: '&8[&d私聊&8] [&6%player_name% &7➥ &2%trchat_toplayer%&8] '
    msg:
      default-color: 'f'
      special-char:
        enabled: false
        special-char-color: '&f'
      hover: '&7日期: %server_time_HH:mm:ss%'

# Placeholders & Conditions are available only when not proxy!
Console:
  - prefix:
      server:
        text: '&8[&d私聊&8] [&6控制台 &7➥ &2你&8] '
    msg:
      default-color: 'f'
      special-char:
        enabled: false
        special-char-color: '&f'
